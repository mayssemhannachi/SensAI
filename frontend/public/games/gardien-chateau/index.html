<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le Gardien du Château</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      position: relative;
      background: #0f172a;
      font-family: "Trebuchet MS", Arial, sans-serif;
    }
    #castle-banner {
      position: fixed;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center bottom;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #cam {
      position: fixed;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
    }
    body.camera-active #castle-banner {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }
    body.camera-active #cam {
      visibility: visible;
      opacity: 1;
    }
    #game { position: fixed; z-index: 1; inset: 0; }
    #game canvas { display: block; width: 100% !important; height: 100% !important; }
  </style>
  <script type="module" crossorigin src="./assets/index-DxZ_fkD2.js"></script>
</head>

<body>
  <img id="castle-banner" src="/Assets/gardien%20chateau/Whimsical%20Castle%20Garden%20Banner.png" alt="">
  <video id="cam" playsinline muted></video>
  <div id="game"></div>
</body>

</html>
