[theme]
base = "light"
primaryColor = "#5B5BD6"
backgroundColor = "#F6F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E2638"
font = "sans serif"
borderColor = "#D9DDE7"
